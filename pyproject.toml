[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-cost"
version = "1.0.0"
description = "Explainable regression model and Streamlit estimator for annual medical charges."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
    "scipy>=1.12,<2",
    "joblib>=1.3,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "jupyter>=1.0,<2",
    "nbconvert>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests that need data/raw/insurance.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
